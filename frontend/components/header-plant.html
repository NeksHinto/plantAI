<header class="plant-header">
  <div class="container plant-header__inner">
    <a class="plant-header__back" href="plant.html">
      <i data-lucide="arrow-left" aria-hidden="true"></i>
      <img class="plant-header__avatar" data-plant-avatar src="" alt="" style="display: none;">
      <div>
        <p class="plant-header__name" data-plant-name></p>
        <p class="plant-header__species" data-plant-species></p>
      </div>
    </a>
    <div class="plant-header__actions" id="plant-header-actions" style="display: none;">
      <button type="button" class="btn btn--outline btn--sm" id="plant-header-edit-btn" title="Editar planta">
        <i data-lucide="pencil" aria-hidden="true"></i>
        <span>Editar</span>
      </button>
      <button type="button" class="btn btn--danger-outline btn--sm" id="plant-header-delete-btn" title="Eliminar planta">
        <i data-lucide="trash-2" aria-hidden="true"></i>
        <span>Eliminar</span>
      </button>
    </div>
  </div>
</header>
