<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambiente | PlantAI</title>
  <link rel="stylesheet" href="../styles/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="app-shell">
  <div data-include="../components/header-app.html"></div>

  <main class="page-main container">
    <nav aria-label="Migas de pan">
      <a href="dashboard.html"><i data-lucide="arrow-left" aria-hidden="true"></i> Volver al dashboard</a>
    </nav>

    <div id="room-expanded"></div>

    <div id="rooms-collapsed" class="room-collapsed-grid"></div>
  </main>


  <div class="modal-overlay" id="edit-room-modal" hidden>
    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="edit-room-title"
    >
      <h2 class="modal__title" id="edit-room-title">
        Editar ambiente
      </h2>

      <form id="edit-room-form">
        <div class="modal__field">
          <label for="edit-room-name">Nombre del ambiente</label>

          <input
            class="modal__input"
            id="edit-room-name"
            name="name"
            type="text"
            maxlength="60"
            required
          >
        </div>

        <div class="modal__field">
          <label for="edit-room-location">Ubicacion</label>

          <select
            class="modal__input"
            id="edit-room-location"
            name="isIndoors"
            required
          >
            <option value="true">Interior</option>
            <option value="false">Exterior</option>
          </select>
        </div>

        <div class="modal__field">
          <label for="edit-room-temperature">
            Temperatura del ambiente
          </label>

          <input
            class="modal__input"
            id="edit-room-temperature"
            name="temperatureLevel"
            type="number"
            min="-20"
            max="60"
            step="0.1"
            required
          >
        </div>

        <p class="modal__error" id="edit-room-error" hidden></p>

        <div class="modal__actions">
          <button
            class="btn btn--secondary"
            id="cancel-edit-room"
            type="button"
          >
            Cancelar
          </button>

          <button
            class="btn btn--primary"
            type="submit"
          >
            Guardar cambios
          </button>
        </div>
      </form>
    </section>
  </div>


  <div class="modal-overlay" id="delete-room-modal" hidden>
    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-room-title"
    >
      <h2 class="modal__title" id="delete-room-title">
        Eliminar ambiente
      </h2>

      <p class="modal__message">
        Las plantas asociadas a este ambiente dejaran de estar disponibles,
        deseas continuar
      </p>

      <p class="modal__error" id="delete-room-error" hidden></p>

      <div class="modal__actions">
        <button
          class="btn btn--secondary"
          id="cancel-delete-room"
          type="button"
        >
          Cancelar
        </button>

        <button
          class="btn btn--danger"
          id="confirm-delete-room"
          type="button"
        >
          Eliminar ambiente
        </button>
      </div>
    </section>
  </div>

  <div data-include="../components/footer.html"></div>

  <script src="../utils/include.js"></script>
  <script type="module" src="../utils/header.js"></script>
  <script type="module" src="../utils/room.js"></script>
</body>
</html>
