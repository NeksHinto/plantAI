<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambiente | PlantAI</title>
  <link rel="stylesheet" href="../styles/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="app-shell">
  <div data-include="../components/header-app.html"></div>

  <main class="page-main container">
    <nav aria-label="Migas de pan">
      <a href="dashboard.html"><i data-lucide="arrow-left" aria-hidden="true"></i> Volver al dashboard</a>
    </nav>

    <div id="room-expanded"></div>

    <div class="btn-group section-spacing">
      <button
        class="btn btn--danger"
        id="delete-room-button"
        type="button"
      >
        Eliminar ambiente
      </button>
    </div>

    <div id="rooms-collapsed" class="room-collapsed-grid"></div>
  </main>

  <div class="modal-overlay" id="delete-room-modal" hidden>
    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-room-title"
    >
      <h2 class="modal__title" id="delete-room-title">
        Eliminar ambiente
      </h2>

      <p class="modal__message">
        Las plantas asociadas a este ambiente dejaran de estar disponibles,
        deseas continuar
      </p>

      <p class="modal__error" id="delete-room-error" hidden></p>

      <div class="modal__actions">
        <button
          class="btn btn--secondary"
          id="cancel-delete-room"
          type="button"
        >
          Cancelar
        </button>

        <button
          class="btn btn--danger"
          id="confirm-delete-room"
          type="button"
        >
          Eliminar ambiente
        </button>
      </div>
    </section>
  </div>

  <div data-include="../components/footer.html"></div>

  <script src="../utils/include.js"></script>
  <script type="module" src="../utils/header.js"></script>
  <script type="module" src="../utils/room.js"></script>
</body>
</html>
