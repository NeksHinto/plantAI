<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de planta | PlantAI</title>
  <link rel="stylesheet" href="../styles/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="app-shell">
  <div data-include="../components/header-plant.html"></div>

  <main class="page-main container">
    <a id="scan-plant-btn" class="btn btn--primary btn--block section-spacing" href="scanner.html">
      <i data-lucide="camera" aria-hidden="true"></i> Escanear planta
    </a>

    <section aria-labelledby="plant-info-heading" class="section-spacing">
      <h2 id="plant-info-heading">Información</h2>
      <div id="plant-info"></div>
    </section>

    <section aria-labelledby="history-heading" class="section-spacing">
      <h2 id="history-heading">Historial clínico</h2>
      <div id="timeline" class="timeline"></div>
    </section>

    <section class="scan-album" aria-labelledby="album-heading">
      <h2 id="album-heading" class="scan-album__title">Álbum de escaneos</h2>
      <div id="scan-album"></div>
    </section>
  </main>

  <div class="modal-overlay" id="edit-plant-modal" hidden>
    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="edit-plant-title"
    >
      <h2 class="modal__title" id="edit-plant-title">
        Editar planta
      </h2>

      <form id="edit-plant-form">
        <div class="modal__field">
          <label for="edit-plant-name">Nombre de la planta</label>

          <input
            class="modal__input"
            id="edit-plant-name"
            name="name"
            type="text"
            maxlength="60"
            required
          >
        </div>

        <p class="modal__error" id="edit-plant-error" hidden></p>

        <div class="modal__actions">
          <button
            class="btn btn--secondary"
            id="cancel-edit-plant"
            type="button"
          >
            Cancelar
          </button>

          <button class="btn btn--primary" type="submit">
            Guardar cambios
          </button>
        </div>
      </form>
    </section>
  </div>

  <div data-include="../components/footer.html"></div>

  <script src="../utils/include.js"></script>
  <script type="module" src="../utils/plant.js"></script>
</body>
</html>
