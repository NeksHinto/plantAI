<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis ambientes | PlantAI</title>
  <link rel="icon" type="image/png" href="../src/PlantAI-icon.png">
  <link rel="stylesheet" href="../styles/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="app-shell">
  <div data-include="../components/header-app.html"></div>

  <main class="page-main container">
    <nav class="tab-nav" aria-label="Secciones del dashboard">
      <button class="tab-nav__btn is-active" type="button" data-tab="ambientes" aria-selected="true">
        <i data-lucide="home" aria-hidden="true"></i> Ambientes
      </button>
      <button class="tab-nav__btn" type="button" data-tab="plantas" aria-selected="false">
        <i data-lucide="sprout" aria-hidden="true"></i> Plantas
      </button>
    </nav>

    <section class="tab-panel is-active" data-tab="ambientes" aria-labelledby="ambientes-heading">
      <h2 id="ambientes-heading" class="sr-only">Ambientes</h2>

      <div class="tab-panel__toolbar">
        <div id="rooms-search"></div>
        <div id="rooms-page-size"></div>
        <div id="rooms-pagination"></div>
        <button class="btn btn--primary" id="add-room-button" type="button">
          Agregar ambiente
        </button>
      </div>

      <div id="rooms-grid" class="card-grid card-grid--rooms"></div>
    </section>

    <section class="tab-panel" data-tab="plantas" aria-labelledby="plantas-heading">
      <h2 id="plantas-heading" class="sr-only">Plantas</h2>

      <div class="tab-panel__toolbar">
        <div id="plants-search"></div>
        <div id="plants-page-size"></div>
        <div id="plants-pagination"></div>
        <button class="btn btn--primary" id="add-plant-button" type="button">
          Agregar planta
        </button>
      </div>

      <div id="plants-grid" class="card-grid card-grid--plants"></div>
    </section>
  </main>

  <div class="modal-overlay" id="room-modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="room-modal-title">
      <h2 class="modal__title" id="room-modal-title">
        Agregar ambiente
      </h2>

      <form id="room-form">
        <div class="modal__field">
          <label for="room-name">Nombre</label>

          <input class="modal__input" id="room-name" name="name" type="text" maxlength="60" required>
        </div>

        <div class="modal__field">
          <label for="room-location">Ubicacion</label>

          <select class="modal__input" id="room-location" name="isIndoors" required>
            <option value="true">Interior</option>
            <option value="false">Exterior</option>
          </select>
        </div>

        <div class="modal__field">
          <label for="room-temperature">
            Temperatura del ambiente
          </label>

          <input class="modal__input" id="room-temperature" name="temperatureLevel" type="number" min="-20" max="60"
            step="0.1" placeholder="Ejemplo: 24" required>
        </div>


        <p class="modal__error" id="room-form-error" hidden></p>

        <div class="modal__actions">
          <button class="btn btn--secondary" id="cancel-room-button" type="button">
            Cancelar
          </button>

          <button class="btn btn--primary" type="submit">
            Guardar ambiente
          </button>
        </div>
      </form>
    </section>
  </div>

  <div class="modal-overlay" id="edit-room-modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-room-title">
      <h2 class="modal__title" id="edit-room-title">
        Editar ambiente
      </h2>

      <form id="edit-room-form">
        <div class="modal__field">
          <label for="edit-room-name">Nombre del ambiente</label>

          <input class="modal__input" id="edit-room-name" name="name" type="text" maxlength="60" required>
        </div>

        <div class="modal__field">
          <label for="edit-room-location">Ubicacion</label>

          <select class="modal__input" id="edit-room-location" name="isIndoors" required>
            <option value="true">Interior</option>
            <option value="false">Exterior</option>
          </select>
        </div>

        <div class="modal__field">
          <label for="edit-room-temperature">
            Temperatura del ambiente
          </label>

          <input class="modal__input" id="edit-room-temperature" name="temperatureLevel" type="number" min="-20"
            max="60" step="0.1" placeholder="Ejemplo: 24" required>
        </div>

        <p class="modal__error" id="edit-room-error" hidden></p>

        <div class="modal__actions">
          <button class="btn btn--secondary" id="cancel-edit-room" type="button">
            Cancelar
          </button>

          <button class="btn btn--primary" type="submit">
            Guardar cambios
          </button>
        </div>
      </form>
    </section>
  </div>

  <div class="modal-overlay" id="delete-room-modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-room-title">
      <h2 class="modal__title" id="delete-room-title">
        Eliminar ambiente
      </h2>

      <p class="modal__message">
        Las plantas asociadas a este ambiente dejaran de estar disponibles, ¿deseas continuar?
      </p>

      <p class="modal__error" id="delete-room-error" hidden></p>

      <div class="modal__actions">
        <button class="btn btn--secondary" id="cancel-delete-room" type="button">
          Cancelar
        </button>

        <button class="btn btn--danger" id="confirm-delete-room" type="button">
          Eliminar ambiente
        </button>
      </div>
    </section>
  </div>

  <div class="modal-overlay" id="select-room-modal" hidden>
    <section class="modal modal--select-room" role="dialog" aria-modal="true" aria-labelledby="select-room-title">
      <div class="modal__header">
        <h2 class="modal__title" id="select-room-title">
          ¿En qué ambiente querés agregar la planta?
        </h2>
        <p class="modal__message">
          Seleccioná un ambiente para asociar tu nueva planta
        </p>
      </div>

      <div class="room-selector__search" id="select-room-search-container"></div>

      <div class="room-selector__list" id="select-room-list"></div>

      <p class="modal__error" id="select-room-error" hidden></p>

      <div class="modal__actions">
        <button class="btn btn--secondary" id="cancel-select-room" type="button">
          Cancelar
        </button>
        <button class="btn btn--primary" id="confirm-select-room" type="button" disabled>
          Continuar
        </button>
      </div>
    </section>
  </div>

  <div data-include="../components/footer.html"></div>

  <script src="../utils/include.js"></script>
  <script type="module" src="../utils/header.js"></script>
  <script type="module" src="../utils/dashboard.js"></script>
</body>

</html>
