<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escanear planta | PlantAI</title>
  <link rel="stylesheet" href="../styles/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="app-shell">
  <div data-include="../components/header-plant.html"></div>

  <main class="page-main page-main--narrow">
    <header class="page-title">
      <h2>Paso 1: Escanear planta</h2>
      <p>Elegí una opción para agregar una imagen</p>
    </header>

    <form id="scanner-form">
      <section class="scanner-zone" aria-labelledby="scanner-heading">
        <h3 id="scanner-heading" class="sr-only">Opciones de escaneo</h3>
        <div class="scanner-zone__icon" aria-hidden="true"><i data-lucide="leaf"></i></div>
        <p class="scanner-zone__title">Escanear o adjuntar foto</p>
        <p class="scanner-zone__subtitle">Para analizar el estado de tu planta</p>

        <button class="scanner-option" type="button" id="scan-camera-btn">
          <span class="scanner-option__icon" aria-hidden="true"><i data-lucide="camera"></i></span>
          <span>
            <span class="scanner-option__label">Escanear con cámara</span>
            <span class="scanner-option__hint">Usá la cámara de tu dispositivo para tomar una foto</span>
          </span>
        </button>

        <label class="scanner-option">
          <span class="scanner-option__icon" aria-hidden="true"><i data-lucide="paperclip"></i></span>
          <span>
            <span class="scanner-option__label">Adjuntar foto</span>
            <span class="scanner-option__hint">Seleccioná una imagen desde tu galería o archivos</span>
          </span>
          <input class="sr-only" id="scan-file-input" type="file" accept="image/*">
        </label>

        <div class="scanner-preview" id="scanner-preview" hidden>
          <img
            class="scanner-preview__image"
            id="scanner-preview-image"
            alt="Vista previa de la imagen seleccionada"
          >

          <p class="scanner-preview__name" id="scanner-preview-name"></p>
        </div>

        <button
          class="btn btn--primary btn--block"
          id="scan-submit-btn"
          type="submit"
          disabled
        >
          Analizar imagen
        </button>

        <p class="scanner-zone__privacy">
          <i data-lucide="lock" aria-hidden="true"></i>
          Tus imágenes están protegidas y solo se usan para análisis de la planta
        </p>
      </section>
    </form>
  </main>

  <div data-include="../components/footer.html"></div>

  <script src="../utils/include.js"></script>
  <script type="module" src="../utils/scanner.js"></script>
</body>
</html>
