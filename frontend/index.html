<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | PlantAI</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body class="app-shell">
  <div data-include="components/header-login.html"></div>

  <main class="page-main container">
    <section class="login-form" aria-labelledby="login-heading">
      <h2 id="login-heading">Iniciar sesión</h2>

      <form action="pages/dashboard.html" method="get">
        <div class="form-field">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" autocomplete="username" required>
        </div>

        <div class="form-field">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
        </div>

        <button class="btn btn--primary btn--block" type="submit">Ingresar</button>
      </form>
    </section>
  </main>

  <div data-include="components/footer.html"></div>

  <script src="functions/include.js"></script>
</body>
</html>
