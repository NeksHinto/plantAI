<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | PlantAI</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body class="app-shell">
  <div data-include="components/header-login.html"></div>

  <main class="page-main container">
    <section class="login-form" aria-labelledby="login-heading">
      <h2 id="login-heading">Iniciar sesión</h2>

      <div id="login-error"></div>

      <form id="login-form">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button class="btn btn--primary btn--block" type="submit">Ingresar</button>
      </form>
    </section>
  </main>

  <div data-include="components/footer.html"></div>

  <script src="utils/include.js"></script>
  <script type="module" src="utils/login.js"></script>
</body>
</html>
